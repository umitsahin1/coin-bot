name: probe-exchanges

# Manual-only diagnostic: pings public market endpoints from the GitHub
# runner so we can see which exchanges are reachable from US IPs.
# Once we've picked an exchange this file can be deleted.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Where am I?
        run: |
          echo "Runner public IP / geo:"
          curl -sS https://ipinfo.io/json || true
          echo
      - name: Ping exchange endpoints
        run: |
          set +e
          for url in \
            "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT" \
            "https://api.bybit.com/v5/market/tickers?category=spot&symbol=BTCUSDT" \
            "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT" \
            "https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT" \
            "https://api.kucoin.com/api/v1/market/stats?symbol=BTC-USDT" \
            "https://api.gateio.ws/api/v4/spot/tickers?currency_pair=BTC_USDT" \
            "https://api.kraken.com/0/public/Ticker?pair=XBTUSDT" \
            "https://api.mexc.com/api/v3/ticker/24hr?symbol=BTCUSDT" \
            "https://api.bitget.com/api/v2/spot/market/tickers?symbol=BTCUSDT"
          do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 8 "$url")
            short=$(head -c 80 /tmp/body | tr '\n' ' ')
            printf "%3s  %s\n        body: %s\n" "$code" "$url" "$short"
          done
