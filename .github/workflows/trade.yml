name: paper-trade

on:
  # Run 5 minutes after each 4h Binance candle close (UTC).
  # 4h closes: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:        # allow manual run from the Actions tab

permissions:
  contents: write           # needed to commit state.json back

# Shared with guard.yml: the two jobs must never write state.json at the
# same time.
concurrency:
  group: coin-bot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: python cli.py auto

      - name: Commit updated state
        run: |
          set -euo pipefail
          git config user.name  "coin-bot"
          git config user.email "coin-bot@users.noreply.github.com"
          if git diff --quiet -- state.json; then
            echo "No state changes."
            exit 0
          fi
          git add state.json
          git commit -m "auto: $(date -u +'%Y-%m-%d %H:%MZ') run"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::state.json rebase conflict — resolve by hand"
              exit 1
            fi
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::push failed after 3 attempts"
          exit 1
